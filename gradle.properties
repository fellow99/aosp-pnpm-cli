# ── 公共元数据（可提交）──────────────────────────────────────────────────────
GROUP=io.github.fellow99
VERSION_NAME=0.1.0
# CLI 制品版本 = 工具上游版本 = Maven 坐标 version（独立 semver，见 docs/000-工程规划.md）。
# 多版本发布：-PCLI_VERSION=<pnpm 版本>（见 pnpm-cli.lock.json 的 releases）。
# 2026-11-03 钉选 12.16.1（npm dist-tags 实测最新稳定版；tarball sha256 已回写 lock）。
CLI_VERSION=12.16.1
POM_NAME=pnpm-cli
POM_DESCRIPTION=pnpm command-line executable (libpnpm_cli.so) for Android arm64-v8a - Rust standalone binary (pnpm 12+) cross-compiled from the official pnpm source; runtime dependency on node (PATH) for package lifecycle scripts
POM_URL=https://github.com/fellow99/aosp-pnpm-cli
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_SCM_CONNECTION=scm:git:git://github.com/fellow99/aosp-pnpm-cli.git
POM_SCM_DEVELOPMENT_CONNECTION=scm:git:git://github.com/fellow99/aosp-pnpm-cli.git
POM_DEVELOPER_ID=fellow99
POM_DEVELOPER_NAME=fellow99

# 发布门禁（默认关；真实发布时 RELEASE=true + 用户级 gradle.properties 提供 Token/GPG）
RELEASE=false
